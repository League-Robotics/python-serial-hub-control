[project]
name = "rhsp"
version = "0.20260606.2"
description = "Pure-Python driver for the REV Robotics Expansion/Control Hub serial protocol (RHSP / DEKA interface)"
readme = "README.md"
authors = [
    { name = "Eric Busboom", email = "eric@busboom.org" }
]
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
requires-python = ">=3.13"
keywords = ["rev-robotics", "ftc", "expansion-hub", "control-hub", "serial", "robotics", "rhsp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyserial>=3.5",
]

[project.urls]
Repository = "https://github.com/League-Robotics/python-serial-hub-control"

[dependency-groups]
dev = [
    "pytest>=8",
]

[project.optional-dependencies]
bench = ["matplotlib>=3.8", "numpy>=1.26"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# NOTE: the installed package is src/rhsp (new idiomatic library). vendor/rhsp
# is kept on disk unchanged as a reference implementation.
[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
# The hardware-free suite under tests/ is the project gate. The decompiled
# reference under vendor/ ships its own old-API tests; don't collect them.
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/rhsp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/rhsp",
    "vendor/rhsp",
    "docs",
    "examples",
    "tests",
    "README.md",
    "LICENSE.txt",
    "pyproject.toml",
]
