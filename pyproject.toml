[project]
name = "rhsp"
version = "0.20260605.12"
description = "Pure-Python driver for the REV Robotics Expansion/Control Hub serial protocol (RHSP / DEKA interface)"
readme = "README.md"
authors = [
    { name = "Eric Busboom", email = "eric@busboom.org" }
]
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
requires-python = ">=3.13"
keywords = ["rev-robotics", "ftc", "expansion-hub", "control-hub", "serial", "robotics", "rhsp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyserial>=3.5",
]

[project.urls]
Repository = "https://github.com/League-Robotics/python-serial-hub-control"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# NOTE: the original package now lives under vendor/rhsp as a reference
# implementation ("mostly works"). The new idiomatic library is being built in
# src/rhsp; once it lands, repoint these two targets back to "src/rhsp".
[tool.pytest.ini_options]
pythonpath = ["src", "tests"]

[tool.hatch.build.targets.wheel]
packages = ["vendor/rhsp"]

[tool.hatch.build.targets.sdist]
include = [
    "vendor/rhsp",
    "src/rhsp",
    "docs",
    "test",
    "README.md",
    "LICENSE.txt",
    "pyproject.toml",
]
